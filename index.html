<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Agent UI</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    body { margin: 0; background: #0f172a; color: #e5eefb; }
    .page { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .card { background: #111827; border: 1px solid #243042; border-radius: 18px; padding: 18px; box-shadow: 0 10px 30px rgba(15,23,42,0.35); }
    h1 { margin-top: 0; font-size: 1.8rem; }
    p { color: #c7d2e6; line-height: 1.45; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    input[type="text"] { flex: 1; min-width: 260px; padding: 12px 14px; border-radius: 10px; border: 1px solid #334155; background: #0b1220; color: #eff6ff; font-size: 1rem; }
    button { padding: 12px 16px; border: none; border-radius: 10px; background: linear-gradient(135deg, #2563eb, #7c3aed); color: white; cursor: pointer; font-size: 1rem; font-weight: 600; }
    button:hover { filter: brightness(1.08); }
    #status { color: #bfdbfe; margin-top: 8px; min-height: 1.2em; }
    #report { white-space: pre-wrap; background: #030712; border: 1px solid #1f2937; border-radius: 14px; padding: 16px; margin-top: 16px; color: #eff6ff; line-height: 1.5; }
    .small { font-size: 0.95rem; color: #bfdbfe; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>Research Agent</h1>
      <p>Enter a research topic and the assistant will generate a structured literature-review style report on the page.</p>
      <div class="row">
        <input id="topicInput" type="text" placeholder="e.g. Computer vision in drones" />
        <button id="runBtn" type="button">Generate report</button>
      </div>
      <div id="status" class="small"></div>
      <div id="report">Your report will appear here.</div>
    </div>
  </div>

  <script>
    const runBtn = document.getElementById('runBtn');
    const topicInput = document.getElementById('topicInput');
    const status = document.getElementById('status');
    const reportBox = document.getElementById('report');

    async function generateReport() {
      const topic = topicInput.value.trim();
      if (!topic) {
        status.textContent = 'Please enter a research topic.';
        return;
      }

      status.textContent = 'Generating report...';
      reportBox.textContent = 'Working...';

      try {
        const response = await fetch('/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'Generation failed');
        }

        reportBox.textContent = data.report || 'No report returned.';
        status.textContent = 'Report generated successfully.';
      } catch (error) {
        reportBox.textContent = 'Unable to generate the report right now.';
        status.textContent = error.message || 'Generation failed.';
      }
    }

    runBtn.addEventListener('click', generateReport);
    topicInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') generateReport();
    });
  </script>
</body>
</html>
